[Info]
# Options for configuring Spotify (History) Analyser
# These are all the different types of information that Spotify stores, turn them on/off based on what you want to see
# Audiobooks, podcasts, IP-related info and offline timestamp are *always* ignored by this program
# All options are booleans (true/false)
# The options under "Function" will change how the program chooses tasks at startup
# Config v0.20.2.0420


[DSI]

dsi_Export = True
# Whether to export a CSV for DSI usage
# If this is enabled, it configures everything to fit DSI data standards automatically


[Options]

# Options to toggle what data is saved in the finalised CSV
# Forced information is the Track name, Artist and Album

time_Played_Enabled = True
# Time listened to each track
# Form: Count + list of playtimes per instance (in milliseconds)
# Example: " 4,"[179000, 179000, 12544, 179000]" "

timestamp_Enabled = True
# Timestamp (when the track was started)
# Form: List of timestamps (both date and time)
# Example:" "['2023-07-21', '2023-07-23', '2023-10-23']","['10:15:37', '08:14:13', '11:37:24']" "

track_URI_Enabled = True
# Spotify's own uri for the track
# Form: String + count
# Example: " {'spotify:track:30QR0ndUdiiMQMA9g1PGCm': 4} "
# There's occasionally more than 1 URI for one track, this will get all of them

start_Reason_Enabled = True
# Why the track was started
# Form: String + count
# Example: " {'trackdone': 1, 'fwdbtn': 1} "

stop_Reason_Enabled = True
# Why the track stopped
# Form: String + count
# Example: " {'fwdbtn': 1, 'trackdone': 1} "

shuffle_Enabled = True
# If shuffle was enabled during the track
# Form: Booleans + count
# Example: " {True: 1, False: 1} "

skip_Enabled = True
# If the track was skipped
# Form: Booleans + count
# Example: " {False: 1, True: 1} "

platform_Enabled = False
# Platform (Android, Chromecast, iOS, Windows, etc)
# Form: String + count
# Example: " {'Windows 10 (10.0.19043; x64)': 5, 'Android OS 11 API 30 (samsung, SM-XXXX)': 2} "

offline_Enabled = False
# If the player was offline
# Form: Booleans + count
# Example: " {True: 1, False: 1} "
# Note that if enabled, may give an error about mixed types, just ignore

incognito_Enabled = False
# If "private session" was on
# Form: Booleans + count
# Example: " {True: 1, False: 1} "


[Function]

# These options are checked in sequence at startup
# For example, you can skip Stage 1 automatically, but will be prompted about Stage 2 at startup
# Enabling later stages' skip won't prevent you from using the earlier stages
# These won't have any effect on the program once it's started

always_Skip_Stage_1 = False
# Skips zip -> JSON process (Stage 1) without prompting user
# Default: False

always_Skip_Stage_2 = False
# Skips JSON -> CSV process (Stage 2) without prompting user
# Default: False

always_Skip_Stage_3 = False
# Skips CSV -> clean CSV process (Stage 3) without prompting user
# Default: False


