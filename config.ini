[Info]
# Options for configuring Spotify (History) Analyser
# These are all the different types of information that Spotify stores, turn them on/off based on what you want to see
# Audiobooks, podcasts, IP-related info and offline timestamp are *always* ignored by this program
# The options under "Function" will change how the program chooses tasks at startup
# Config v0.28.2.0010


[DSI]

dsi_Export = False
# Whether to export a CSV for DSI usage
# If this is enabled, it configures everything to fit DSI data standards automatically
# DSI stores only the URI, Playcount, Duration and Total Time
# Accepted values: booleans (True/False)


[Options]

# Options to toggle what data is saved in the CSVs
# Must-store information: Track name, Artist and Album

time_Played_Enabled = True
# Time listened to each track
# Form: Count + list of playtimes per instance (in milliseconds)
# Example: " 4,"[179000, 179000, 12544, 179000]" "
# Accepted values: booleans (True/False)

timestamp_Enabled = True
# Timestamp (when the track was started)
# Form: List of timestamps (both date and time)
# Example:" "['2023-07-21', '2023-07-23', '2023-10-23']","['10:15:37', '08:14:13', '11:37:24']" "
# Accepted values: booleans (True/False)

track_URI_Enabled = True
# Spotify's own uri for the track
# Form: String + count
# Example: " {'spotify:track:30QR0ndUdiiMQMA9g1PGCm': 4} "
# Accepted values: booleans (True/False)

start_Reason_Enabled = True
# Why the track was started
# Form: String + count
# Example: " {'trackdone': 1, 'fwdbtn': 1} "
# Accepted values: booleans (True/False)

stop_Reason_Enabled = True
# Why the track stopped
# Form: String + count
# Example: " {'fwdbtn': 1, 'trackdone': 1} "
# Accepted values: booleans (True/False)

shuffle_Enabled = True
# If shuffle was enabled during the track
# Form: Booleans + count
# Example: " {True: 1, False: 1} "
# Accepted values: booleans (True/False)

skip_Enabled = True
# If the track was skipped
# Form: Booleans + count
# Example: " {False: 1, True: 1} "
# Accepted values: booleans (True/False)

platform_Enabled = False
# Platform (Android, Chromecast, iOS, Windows, etc)
# Form: String + count
# Example: " {'Windows 10 (10.0.19043; x64)': 5, 'Android OS 11 API 30 (samsung, SM-XXXX)': 2} "
# Accepted values: booleans (True/False)

offline_Enabled = False
# If the player was offline
# Form: Booleans + count
# Example: " {True: 1, False: 1} "
# Note that if enabled, may give an error about mixed types, just ignore
# Accepted values: booleans (True/False)

incognito_Enabled = False
# If "private session" was on
# Form: Booleans + count
# Example: " {True: 1, False: 1} "
# Accepted values: booleans (True/False)


[Function]

# These options are checked in sequence at startup
# For example, you can skip Stage 1 automatically, but will be prompted about Stage 2 at startup
# Enabling later stage skips won't prevent you from using the earlier stages
# These don't have any effect on the program once it's started

always_Skip_Stage_1 = False
# Skips zip -> JSON process (Stage 1) without prompting user
# Default: False

always_Skip_Stage_2 = False
# Skips JSON -> CSV process (Stage 2) without prompting user
# Default: False

always_Skip_Stage_3 = False
# Skips CSV -> formatted CSV process (Stage 3) without prompting user
# Default: False


[Summary]

top_Text = My Spotify Streaming Summary:
# What to display at the top of the summary
# Default: " My Spotify Streaming Summary: "
# Accepted values: any string

number_Of_Tracks = 10
# How many tracks should be taken into the top tracks list
# Default: 10
# Accepted values: any positive integer

top_Type = Count
# What to sort the top tracks/artists/albums by
# Time or Count (how *long* the items have been listened to or how *many* times)
# Default: Time
# Accepted values: Time or Count

top_Albums = 5
# How many top albums are calculated
# Uses top_Type to rank
# Default: 5
# Accepted values: any integer (<1 is ignored)

top_Artists = 5
# How many top artists are calculated
# Uses top_Type to rank
# Default: 5
# Accepted values: any integer (<1 is ignored)

top_Months = 3
# How many top months are calculated
# Uses playtime to rank
# Default: 3
# Accepted alues: any integer (<1 is ignored)

top_Month_Type = Each
# Whether to calculate the top month(s) by months or individuals
# Total calculates the total listening time for all of the same month (all streams under "May" for example will be calculated together)
# Each calculates the total listening time for each month separately ("May 2024" is not added to "May 2025")
# Default: Each
# Accepted values: Each or Total

top_Years = 1
# How many top years are calculated
# Uses playtime to rank
# Default: 1
# Accepted values: any integer (<1 is ignored)


[Charts]

username_To_Display = LP
# What name to display at the top of the summary
# Format: " Top <number_Of_Songs> Songs for <username> "
# Default: 
# Accepted values: any string

number_Of_Songs = 10
# How many songs should be taken into the top 
# Default: 10
# Accepted values: any positive integer

top_Songs = Count
# What to sort the top songs by
# Time or Count (how *long* the songs have been listened to or how *many* times)
# Default: Time
# Accepted values: " Time " or " Count "