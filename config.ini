[Info]
# customisation
# these are all the different types of information that spotify stores, turn them on/off at your leisure
# audiobooks, ip and offline timestamp are *always* ignored by this program
# all options under "options" are booleans (true/false)
# the options under "function" will change how the program works, mainly for testing

[Options]
tracknameenabled = True
# name of the track (also enables album name)
# please note that either the track and album names OR episodes must be on
timeplayedenabled = True
# time listened to each track
timestampenabled = True
# timestamp (when the track was started)
artistnameenabled = True
# name of the artist
startreasonenabled = True
# why the track was started
stopreasonenabled = True
# why the track stopped
shuffleenabled = True
# if shuffle was enabled during the track
skipenabled = True
# if the track was skipped prematurely
usernameenabled = False
# username (username)
platformenabled = False
# platform (android, chromecast, ios, etc)
trackurlenabled = True
# spotify's own url for the track
episodesenabled = False
# (podcast) episode name info (also enables show name)
# if this is true, you can turn off track names and albums
episodeurlenabled = False
# spotify's own url for the episode
countryenabled = False
# list country per track (location that spotify logged)
useragentenabled = True
# list the streaming agent (safari, firefox, etc)
offlineenabled = False
# if the user was offline during the track
incognitoenabled = False
# if the user was in a private session.

[Function]
alwaysskipprocessing = False
# skips processing without prompting user (default = False)
alwaysskipanalysing = False
# skips analysing without prompting user (default = False)
alwaysskipgrouping = False
# skips data re-formatting and grouping without prompting user (default = False)

[FirstTimer]
firsttimeuser = False
# whether this is the first time using the program, runs "first time info" script if True (default = True)